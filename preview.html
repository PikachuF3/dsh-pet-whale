<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桌宠小鲸鱼 · 最终定版预览</title>
<style>
  :root {
    --accent: #4D6BFE;      /* 主题蓝强调色 */
    --paper: #F7F2E6;       /* 米白肚皮/背景 */
    --ink: #2E2A24;         /* 暖墨眼睛 */
    --blush: #F0A0A0;       /* 腮红 */
    --bubble: #E8D9BC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--paper);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 20px;
    user-select: none;
    transition: background 0.3s ease;
  }

  /* 桌面壁纸预览模式 */
  body.desktop-mode {
    background: radial-gradient(circle at 50% 30%, #EAE2D2 0%, #D8CEBB 100%);
  }
  body.desktop-mode .header-bar,
  body.desktop-mode .controls,
  body.desktop-mode .interact-bar,
  body.desktop-mode .mode-switch,
  body.desktop-mode .hint {
    opacity: 0.25;
    transition: opacity 0.2s ease;
  }
  body.desktop-mode:hover .header-bar,
  body.desktop-mode:hover .controls,
  body.desktop-mode:hover .interact-bar,
  body.desktop-mode:hover .mode-switch,
  body.desktop-mode:hover .hint {
    opacity: 1;
  }
  
  /* 顶部导航与操作栏 */
  .header-bar {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 440px;
  }
  h1 { font-size: 19px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 6px; }
  .sub { font-size: 12px; opacity: .7; margin: 2px 0 0; }
  
  .top-tools { display: flex; gap: 6px; }
  .tool-btn {
    border: 1px solid rgba(46,42,36,.18);
    background: #FBF8F0;
    color: var(--ink);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12px;
    cursor: pointer;
    display: flex; align-items: center; gap: 4px;
    transition: all .15s ease;
  }
  .tool-btn:hover { background: #F1EBDD; }
  .tool-btn.active { background: var(--accent); color: #FBF8F0; border-color: var(--accent); }

  /* ===== 舞台 ===== */
  .stage-wrap {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
  }
  
  /* 状态互动气泡 */
  .dialog-bubble {
    position: absolute; top: -38px; left: 50%;
    transform: translateX(-50%);
    background: #FFFFFF;
    color: var(--ink);
    border: 1px solid rgba(46,42,36,.15);
    border-radius: 12px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(46,42,36,.08);
    pointer-events: none;
    transition: all .25s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 20;
  }
  .dialog-bubble::after {
    content: ""; position: absolute; bottom: -5px; left: 50%; margin-left: -5px;
    border-width: 5px 5px 0; border-style: solid;
    border-color: #FFFFFF transparent transparent;
  }

  .stage {
    width: 270px; height: 210px;
    border: 1px solid rgba(46,42,36,.12);
    border-radius: 18px;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(46,42,36,.06), transparent 60%),
      #FBF8F0;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    box-shadow: 0 8px 24px rgba(46,42,36,.04);
    transition: all 0.3s ease;
  }

  /* 桌面挂件透明拖拽模式 */
  body.desktop-mode .stage {
    background: transparent;
    border: 1px dashed rgba(163, 80, 44, 0.4);
    box-shadow: none;
    cursor: grab;
  }
  body.desktop-mode .stage:active {
    cursor: grabbing;
  }

  /* 动态波光水面线 */
  .stage::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 32px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(46,42,36,.1), rgba(46,42,36,.15), rgba(46,42,36,.1), transparent);
    animation: waterShimmer 3.5s ease-in-out infinite alternate;
  }
  @keyframes waterShimmer {
    0%   { opacity: 0.4; transform: scaleX(0.92); }
    100% { opacity: 0.9; transform: scaleX(1.04); }
  }

  /* ===== 鲸鱼容器 ===== */
  .pet {
    width: 150px; height: 110px;
    position: relative;
    cursor: pointer;
  }
  .pet svg {
    width: 100%; height: 100%; display: block; overflow: visible;
    transform-origin: 50% 85%;
  }

  /* 泡泡 */
  .bubble {
    position: absolute; left: 50%; bottom: 8px;
    width: 10px; height: 10px; margin-left: -5px;
    border-radius: 50%;
    background: rgba(232,217,188,.9);
    border: 1px solid rgba(46,42,36,.15);
    opacity: 0; pointer-events: none;
  }
  .bubble::after {
    content: ""; position: absolute; left: 2px; top: 2px;
    width: 3px; height: 3px; border-radius: 50%;
    background: rgba(255,255,255,.85);
  }
  .bubble.show { animation: rise 0.9s ease-out forwards; }

  /* 投喂小鱼干 */
  .snack-fish {
    position: absolute; top: -10px; left: 20px;
    font-size: 18px; opacity: 0; pointer-events: none;
    z-index: 15;
  }
  .snack-fish.drop { animation: dropSnack 0.7s ease-in forwards; }

  @keyframes dropSnack {
    0%   { transform: translateY(0) rotate(0); opacity: 1; }
    80%  { transform: translateY(110px) rotate(45deg); opacity: 1; }
    100% { transform: translateY(125px) scale(0.5); opacity: 0; }
  }

  /* 打瞌睡 Zzz 气泡 */
  .sleep-zzz {
    position: absolute; left: 58%; top: 26px;
    font-size: 13px; font-weight: bold; color: #3550C9;
    opacity: 0; pointer-events: none;
  }
  .sleep-mode .sleep-zzz { animation: zzzFloat 2.8s ease-in-out infinite; }
  @keyframes zzzFloat {
    0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
    30%  { opacity: 0.9; }
    100% { transform: translate(14px, -24px) scale(1.15); opacity: 0; }
  }

  /* ===== 状态动画 ===== */
  .pet.idle .tail       { animation: tailWave 1.6s ease-in-out infinite; transform-box: view-box; }
  .pet.idle .body       { animation: bob 3.2s ease-in-out infinite; }
  .pet .eye-group       { animation: blink 4.5s ease-in-out infinite; transform-origin: 52px 40px; }

  .pet.think { animation: dive 3.2s ease-in-out infinite; }

  .pet.working { animation: swim 1.1s ease-in-out infinite; }
  .pet.working .tail { animation: tailFast 0.35s ease-in-out infinite; transform-box: view-box; }
  .pet.working .body { animation: none; }
  .pet.working .keyboard-unit { display: block !important; }
  .pet.working .code-particle { display: block !important; }

  .pet.celebrate { animation: leap 1.4s ease-in-out infinite; }
  .pet.celebrate .bubble { animation: rise 1.2s ease-out 0.3s infinite; }
  .pet.celebrate .bubble.b2 { animation-delay: 0.7s; }
  .pet.celebrate .bubble.b3 { animation-delay: 1.05s; }

  .pet.error { animation: shake 0.5s ease-in-out infinite; }

  /* 双击翻滚花样动作 (360° Barrel Roll) */
  @keyframes rollTrick {
    0%   { transform: translateY(0) rotate(0deg) scale(1, 1); }
    30%  { transform: translateY(-30px) rotate(-120deg) scale(1.08, 0.92); }
    70%  { transform: translateY(-20px) rotate(-260deg) scale(0.95, 1.05); }
    100% { transform: translateY(0) rotate(-360deg) scale(1, 1); }
  }
  .pet.rolling, .pet-official.rolling {
    animation: rollTrick 0.65s cubic-bezier(0.34, 1.4, 0.64, 1) !important;
  }

  /* 休眠打瞌睡动效：整组眼睛闭合为一条线，高光彻底隐藏，绝不残留白点 */
  @keyframes sleepBob {
    0%,100% { transform: translateY(0) scale(1, 1); }
    50%     { transform: translateY(3px) scale(1.02, 0.97); }
  }
  .sleep-mode .body { animation: sleepBob 4s ease-in-out infinite !important; }
  .sleep-mode .eye-group { transform: scaleY(0.08) !important; }
  .sleep-mode .pupil-highlight { opacity: 0 !important; }

  /* keyframes */
  @keyframes tailWave {
    0%,100% { transform: rotate(9deg); }
    50%     { transform: rotate(-15deg); }
  }
  @keyframes tailFast {
    0%,100% { transform: rotate(12deg); }
    50%     { transform: rotate(-22deg); }
  }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-6px); }
  }
  /* 眨眼：整个 eye-group（包括眼黑与高光）一起缩放闭合，眨眼时眼白彻底消失 */
  @keyframes blink {
    0%, 91%, 100% { transform: scaleY(1); }
    94%           { transform: scaleY(0.08); }
    97%           { transform: scaleY(1); }
  }
  @keyframes dive {
    0%, 12%   { transform: translateY(0); opacity: 1; }
    38%, 72%  { transform: translateY(46px); opacity: .45; }
    92%, 100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes leap {
    0%, 100%  { transform: translateY(0) rotate(0deg); }
    18%       { transform: translateY(-34px) rotate(-8deg); }
    42%       { transform: translateY(0) rotate(4deg); }
    60%       { transform: translateY(-14px) rotate(-3deg); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-5px); }
    50%      { transform: translateX(4px); }
    75%      { transform: translateX(-3px); }
  }
  @keyframes rise {
    0%   { transform: translateY(0) scale(.6); opacity: 0; }
    20%  { opacity: .9; }
    100% { transform: translateY(-70px) scale(1.1); opacity: 0; }
  }

  /* Q 弹：浮动 + 挤压拉伸 */
  @keyframes qbob {
    0%,100% { transform: translateY(0) scale(1, 1); }
    22%     { transform: translateY(-7px) scale(.985, 1.035); }
    50%     { transform: translateY(2px) scale(1.02, .965); }
    72%     { transform: translateY(-3px) scale(.995, 1.012); }
  }
  /* 深潜：下沉压扁 + 划水微摆，上浮拉伸 */
  @keyframes dive2 {
    0%, 10%  { transform: translateY(0) rotate(0) scale(1, 1); opacity: 1; }
    24%      { transform: translateY(12px) rotate(-7deg) scale(1.03, .95); opacity: .78; }
    38%, 70% { transform: translateY(46px) rotate(3deg) scale(.95, 1.05); opacity: .42; }
    84%      { transform: translateY(9px) rotate(-5deg) scale(1.03, .96); opacity: .85; }
    94%,100% { transform: translateY(0) rotate(0) scale(1, 1); opacity: 1; }
  }
  /* 完成：跃起拉伸 → 落地 squash 回弹 */
  @keyframes leap2 {
    0%, 100%  { transform: translateY(0) rotate(0) scale(1, 1); }
    14%       { transform: translateY(-38px) rotate(-10deg) scale(.97, 1.06); }
    36%       { transform: translateY(2px) rotate(5deg) scale(1.09, .88); }
    52%       { transform: translateY(-17px) rotate(-4deg) scale(.98, 1.04); }
    72%       { transform: translateY(-4px) rotate(2deg) scale(1.03, .94); }
  }
  /* 点击挤压回弹：作用在内部 SVG 上，完全不干扰外部位置位移，绝无打断回位 */
  @keyframes squish {
    0%   { transform: scale(1, 1); }
    25%  { transform: scale(1.15, 0.82); }
    55%  { transform: scale(0.93, 1.09); }
    78%  { transform: scale(1.03, 0.98); }
    100% { transform: scale(1, 1); }
  }
  .pet.squish svg,
  .pet-official.squish svg {
    animation: squish 0.42s cubic-bezier(0.25, 1.4, 0.5, 1);
  }

  /* 阴影随浮动收缩 */
  @keyframes shadowBob {
    0%,100% { transform: scale(1); opacity: .9; }
    50%     { transform: scale(.78); opacity: .5; }
  }
  /* 工作：往前游动（水平往返 + 身体轻摆） */
  @keyframes swim {
    0%,100% { transform: translateX(-5px) translateY(0) rotate(-1.5deg); }
    50%     { transform: translateX(5px) translateY(-2.5px) rotate(1.5deg); }
  }
  /* 键盘敲击微动 */
  @keyframes keyTap1 {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(0.4px); }
  }
  @keyframes keyTap2 {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(0.4px); }
  }
  .tap-k1 { animation: keyTap1 0.16s ease-in-out infinite alternate; }
  .tap-k2 { animation: keyTap2 0.18s ease-in-out 0.08s infinite alternate; }

  /* 代码字符飘出动画 */
  @keyframes codeFloat1 {
    0%   { transform: translateY(0) scale(0.5); opacity: 0; }
    30%  { opacity: 0.95; }
    100% { transform: translateY(-16px) translateX(-5px) scale(1); opacity: 0; }
  }
  @keyframes codeFloat2 {
    0%   { transform: translateY(0) scale(0.5); opacity: 0; }
    30%  { opacity: 0.95; }
    100% { transform: translateY(-17px) translateX(4px) scale(1.05); opacity: 0; }
  }
  .code-fx1 { animation: codeFloat1 1.2s ease-out infinite; }
  .code-fx2 { animation: codeFloat2 1.2s ease-out 0.6s infinite; }

  /* 深潜气泡上浮（带横向漂移） */
  @keyframes riseBlue {
    0%   { transform: translate(8px, 30px) scale(.5); opacity: 0; }
    25%  { opacity: .85; }
    100% { transform: translate(-10px, -46px) scale(1.15); opacity: 0; }
  }
  /* 尴尬黑线抖动 */
  @keyframes angryJitter {
    0%,100% { transform: translateX(0); }
    50%     { transform: translateX(-1.2px); }
  }
  /* 星星旋转闪烁 */
  @keyframes starSpin {
    0%,100% { transform: scale(1) rotate(0deg); opacity: 1; }
    50%     { transform: scale(1.3) rotate(22deg); opacity: .65; }
  }

  /* 悬停互动：腮红加深，更开心 */
  .pet:hover .eye-group, .pet-official:hover .eye-group {
    filter: drop-shadow(0 0 1px rgba(217, 142, 106, 0.8));
  }

  /* ===== 控制区 ===== */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 420px; }
  .controls button {
    border: 1px solid rgba(46,42,36,.18);
    background: #FBF8F0;
    color: var(--ink);
    border-radius: 999px;
    padding: 7px 15px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .controls button:hover { background: #F1EBDD; transform: translateY(-1px); }
  .controls button.active { background: var(--accent); color: #FBF8F0; border-color: var(--accent); }

  /* 互动操作按钮 */
  .interact-bar {
    display: flex; gap: 8px; justify-content: center; margin-top: -6px;
  }
  .interact-btn {
    border: 1px dashed rgba(46,42,36,.25);
    background: #FFFDF9;
    color: var(--accent);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; gap: 4px;
    transition: all .15s;
  }
  .interact-btn:hover { background: #F7EFE4; border-color: var(--accent); }

  .hint { font-size: 12px; opacity: .6; text-align: center; max-width: 420px; margin: 0; line-height: 1.5; }

  /* ===== V2：官方轮廓版（完整复用 FishLogo 官方纯正路径）===== */
  .pet-official {
    width: 190px; height: 140px;
    position: relative;
    cursor: pointer;
  }
  .pet-official svg {
    width: 100%; height: 100%; display: block; overflow: visible;
    transform-origin: 50% 85%;
  }
  .pet-official .body { animation: qbob 3.2s ease-in-out infinite; }
  .pet-official .eye-group { animation: blink 4.5s ease-in-out infinite; transform-origin: 5.55px 5.7px; }
  .pet-official.think { animation: dive2 3.2s ease-in-out infinite; }
  /* 深潜时浅蓝气泡 */
  .pet-official .bubble-blue {
    position: absolute; left: 50%; bottom: 6px;
    width: 9px; height: 9px; margin-left: -4.5px;
    border-radius: 50%;
    background: rgba(168, 200, 232, .78);
    border: 1px solid rgba(96, 138, 190, .4);
    opacity: 0; pointer-events: none;
  }
  .pet-official .bubble-blue::after {
    content: ""; position: absolute; left: 2px; top: 2px;
    width: 2.5px; height: 2.5px; border-radius: 50%;
    background: rgba(255,255,255,.85);
  }
  .pet-official.think .bubble-blue { animation: riseBlue 3.2s ease-out infinite; }
  .pet-official.think .bubble-blue.bb2 { animation-delay: 0.9s; }
  .pet-official.think .bubble-blue.bb3 { animation-delay: 1.8s; }
  /* 工作：往前游 + 键盘敲击 */
  .pet-official.working { animation: swim 1.1s ease-in-out infinite; }
  .pet-official.working .body { animation: none; }
  .pet-official.working .keyboard-unit { display: block !important; }
  .pet-official.working .code-particle { display: block !important; }
  /* 报错：头顶尴尬黑线 */
  .pet-official.error .angry { display: block; animation: angryJitter 0.5s ease-in-out infinite; }
  /* 完成：星星闪光 */
  .pet-official.celebrate .stars { display: block; }
  .pet-official.celebrate .starL { animation: starSpin 1.2s ease-in-out infinite; }
  .pet-official.celebrate .starR { animation: starSpin 1.2s ease-in-out 0.3s infinite; }
  .pet-official.celebrate { animation: leap2 1.4s ease-in-out infinite; }
  .pet-official.celebrate .bubble { animation: rise 1.2s ease-out 0.3s infinite; }
  .pet-official.celebrate .bubble.b2 { animation-delay: 0.7s; }
  .pet-official.celebrate .bubble.b3 { animation-delay: 1.05s; }
  .pet-official.error { animation: shake 0.5s ease-in-out infinite; }
  /* 地面阴影：与浮动联动，浮起时收缩变淡 → 立体/离地感 */
  .pet-official::after {
    content: ""; position: absolute; left: 50%; bottom: -16px;
    width: 110px; height: 16px; margin-left: -55px;
    background: radial-gradient(ellipse, rgba(46,42,36,.24), transparent 65%);
    border-radius: 50%;
    animation: shadowBob 3.2s ease-in-out infinite;
    pointer-events: none;
  }

  /* 自主游动模式样式 */
  .pet.swimming .body,
  .pet-official.swimming .body { animation: swimBody 0.85s ease-in-out infinite alternate; }
  .pet.swimming-dive,
  .pet-official.swimming-dive { filter: drop-shadow(0 6px 14px rgba(53, 80, 201, 0.28)); }
  .pet.swimming-dive .bubble-blue,
  .pet-official.swimming-dive .bubble-blue { display: block; animation: riseBlue 1.2s ease-out infinite; }
  @keyframes swimBody {
    0%   { transform: translateY(0) rotate(-1.2deg) scale(1, 1); }
    100% { transform: translateY(-1.8px) rotate(1.2deg) scale(0.99, 1.015); }
  }

  /* 游动尾流扩散水纹圈与流线水泡 */
  .pw-water-ripple {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    border: 1.5px solid rgba(143, 181, 255, 0.65);
    background: radial-gradient(ellipse at center, rgba(143, 181, 255, 0.22) 0%, rgba(77, 107, 254, 0.05) 55%, transparent 75%);
    transform: translate(-50%, -50%) scale(0.2);
    animation: pw-rippleFade 1s cubic-bezier(0.12, 0.8, 0.32, 1) forwards;
    z-index: 898;
    box-shadow: 0 0 8px rgba(143, 181, 255, 0.35);
  }
  @keyframes pw-rippleFade {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.85; }
    60% { opacity: 0.45; }
    100% { transform: translate(-50%, -50%) scale(1.65); opacity: 0; }
  }

  .pw-stream-bubble {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FFFFFF 0%, rgba(180, 215, 255, 0.85) 55%, rgba(77, 107, 254, 0.45) 100%);
    border: 0.8px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 0 4px rgba(143, 181, 255, 0.5), inset -1px -1px 2px rgba(53, 80, 201, 0.3);
    animation: pw-bubbleFloat var(--pw-b-dur, 1.1s) cubic-bezier(0.2, 0.7, 0.4, 1) forwards;
    z-index: 899;
  }
  @keyframes pw-bubbleFloat {
    0% { transform: translate(0, 0) scale(0.3); opacity: 0; }
    20% { opacity: 0.95; }
    80% { opacity: 0.75; transform: translate(var(--pw-b-dx, -10px), var(--pw-b-dy, -20px)) scale(1.05); }
    100% { transform: translate(calc(var(--pw-b-dx, -10px) * 1.3), calc(var(--pw-b-dy, -20px) - 16px)) scale(0.2); opacity: 0; }
  }

  /* 拖拽中样式与动漫眼 */
  .pet.dragging, .pet-official.dragging { animation: none !important; }
  .pet.dragging .eye, .pet.dragging .pupil-highlight,
  .pet-official.dragging .eye, .pet-official.dragging .pupil-highlight { opacity: 0 !important; }
  .pet.dragging .caught-eyes, .pet-official.dragging .caught-eyes { display: block !important; }

  .mode-switch { display: flex; gap: 8px; margin-bottom: 2px; }
  .mode-switch button {
    border: 1px solid rgba(46,42,36,.18); background: #FBF8F0; color: var(--ink);
    border-radius: 999px; padding: 6px 14px; font-size: 12px; cursor: pointer;
  }
  .mode-switch button.active { background: var(--accent); color: #FBF8F0; border-color: var(--accent); }

  /* 气孔微喷泉与庆祝 */
  .pet.celebrate .spout-group,
  .pet-official.celebrate .spout-group,
  .pet.spouting .spout-group,
  .pet-official.spouting .spout-group {
    display: inline !important;
    transform-origin: 8.6px 1.2px;
    animation: pw-spoutSpray 1.3s cubic-bezier(0.2, 0.8, 0.35, 1) infinite;
  }
  @keyframes pw-spoutSpray {
    0%   { transform: scale(0.2) translateY(2px); opacity: 0; }
    25%  { transform: scale(1) translateY(0); opacity: 0.95; }
    70%  { transform: scale(1.08) translateY(-1.5px); opacity: 0.75; }
    100% { transform: scale(1.15) translateY(-3px); opacity: 0; }
  }

  /* 思考态眼神与报错晕眩眼 */
  .pet.think .pupil-highlight,
  .pet-official.think .pupil-highlight { animation: pw-pupilGaze 2s ease-in-out infinite alternate; }
  @keyframes pw-pupilGaze {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(0.35px, -0.42px); }
  }

  .pet.error .eye, .pet.error .pupil-highlight,
  .pet-official.error .eye, .pet-official.error .pupil-highlight { opacity: 0 !important; }
  .pet.error .dizzy-eyes, .pet-official.error .dizzy-eyes {
    display: inline !important;
    transform-origin: 5.55px 5.7px;
    animation: pw-dizzyShake 0.4s ease-in-out infinite alternate;
  }
  @keyframes pw-dizzyShake {
    0%   { transform: rotate(-12deg) scale(0.95); }
    100% { transform: rotate(12deg) scale(1.05); }
  }

  /* 休眠态弯月眼 */
  .pet.sleeping .eye, .pet.sleeping .pupil-highlight,
  .pet-official.sleeping .eye, .pet-official.sleeping .pupil-highlight { opacity: 0 !important; }
  .pet.sleeping .sleep-eyes, .pet-official.sleeping .sleep-eyes { display: inline !important; }

  /* 背部波光焦散折射 */
  .pet .caustic-shimmer, .pet-official .caustic-shimmer {
    animation: pw-causticDrift 4.2s ease-in-out infinite alternate;
  }
  @keyframes pw-causticDrift {
    0%   { transform: translate(-0.6px, 0.3px); opacity: 0.12; stroke-width: 0.9; }
    50%  { opacity: 0.28; stroke-width: 1.25; }
    100% { transform: translate(0.6px, -0.3px); opacity: 0.14; stroke-width: 1.0; }
  }

  /* 破浪跃水与飞溅水滴 */
  .pw-splash-drop {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FFFFFF 0%, rgba(180, 215, 255, 0.9) 60%, rgba(77, 107, 254, 0.5) 100%);
    box-shadow: 0 0 3px rgba(143, 181, 255, 0.6);
    animation: pw-splashFall var(--pw-sp-dur, 0.65s) cubic-bezier(0.25, 0.9, 0.4, 1) forwards;
    z-index: 899;
  }
  @keyframes pw-splashFall {
    0% { transform: translate(0, 0) scale(1); opacity: 0.95; }
    60% { opacity: 0.85; }
    100% { transform: translate(var(--pw-sp-dx, 12px), var(--pw-sp-dy, 35px)) scale(0.2); opacity: 0; }
  }

  /* 悬空拖拽滴水 */
  .pw-drag-drip {
    position: fixed;
    pointer-events: none;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, rgba(160, 205, 255, 0.85) 60%, rgba(77, 107, 254, 0.4) 100%);
    box-shadow: 0 0 3px rgba(143, 181, 255, 0.4);
    animation: pw-dripFall 0.52s cubic-bezier(0.45, 0.05, 0.85, 0.6) forwards;
    z-index: 897;
  }
  @keyframes pw-dripFall {
    0% { transform: translate(0, 0) scale(0.6); opacity: 0.9; }
    50% { transform: translate(0, 14px) scale(0.9, 1.25); opacity: 0.85; }
    100% { transform: translate(0, 46px) scale(0.3, 0.1); opacity: 0; }
  }

  /* 开心态与开心跳跃 */
  .pet.joy, .pet-official.joy {
    animation: pw-joyHop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
  }
  .pet.joy .eye, .pet.joy .pupil-highlight,
  .pet-official.joy .eye, .pet-official.joy .pupil-highlight { opacity: 0 !important; }
  .pet.joy .sleep-eyes, .pet-official.joy .sleep-eyes { display: inline !important; }
  @keyframes pw-joyHop {
    0%, 100% { transform: translateY(0) scale(1); }
    35%      { transform: translateY(-16px) scale(1.08, 0.94); }
    65%      { transform: translateY(-4px) scale(0.96, 1.04); }
  }

  /* 戳晕态与晃动 */
  .pet.dizzy, .pet-official.dizzy {
    animation: pw-dizzyWobble 0.8s ease-in-out !important;
  }
  .pet.dizzy .eye, .pet.dizzy .pupil-highlight,
  .pet-official.dizzy .eye, .pet-official.dizzy .pupil-highlight { opacity: 0 !important; }
  .pet.dizzy .dizzy-eyes, .pet-official.dizzy .dizzy-eyes {
    display: inline !important;
    transform-origin: 5.55px 5.7px;
    animation: pw-dizzyShake 0.35s ease-in-out infinite alternate;
  }
  @keyframes pw-dizzyWobble {
    0%, 100% { transform: rotate(0deg) scale(1); }
    25%      { transform: rotate(-7deg) scale(0.96); }
    75%      { transform: rotate(7deg) scale(0.96); }
  }

  /* 欢迎态 */
  .pet.welcome, .pet-official.welcome {
    animation: leap2 1.2s ease-in-out !important;
  }
  .pet.welcome .stars, .pet-official.welcome .stars { display: block !important; }
  .pet.welcome .spout-group, .pet-official.welcome .spout-group {
    display: inline !important;
    transform-origin: 8.6px 1.2px;
    animation: pw-spoutSpray 1.1s cubic-bezier(0.2, 0.8, 0.35, 1);
  }

  /* 等待与失落态 */
  .pet.wait, .pet-official.wait { animation: pw-wait 1.2s ease-in-out infinite; }
  .pet.wait .bubble-blue, .pet-official.wait .bubble-blue { display: block; animation: riseBlue 1.2s ease-out infinite; }
  .pet.disappointed, .pet-official.disappointed { animation: pw-disappointed 2.6s ease-in-out infinite; }
  @keyframes pw-wait {
    0%, 100% { transform: translateY(0) rotate(0) scale(1, 1); }
    30%      { transform: translateY(-4px) rotate(-2deg) scale(1.01, .99); }
    60%      { transform: translateY(2px) rotate(2deg) scale(.99, 1.01); }
  }
  @keyframes pw-disappointed {
    0%, 100% { transform: translateY(0) rotate(0) scale(1, 1); opacity: 1; }
    40%      { transform: translateY(1px) rotate(-1.5deg) scale(0.99, 1.01); opacity: .88; }
    70%      { transform: translateY(0) rotate(1deg) scale(1, 0.99); opacity: .94; }
  }

  /* 全屏独立固定粒子层 */
  .pw-particle-layer {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 898;
    overflow: hidden;
  }

  /* 庆祝彩屑粒子 */
  .pw-confetti {
    position: absolute;
    pointer-events: none;
    width: var(--pw-cf-w, 7px);
    height: var(--pw-cf-h, 10px);
    background: var(--pw-cf-bg, #4D6BFE);
    border-radius: var(--pw-cf-r, 2px);
    opacity: 0.95;
    animation: pw-confettiFall var(--pw-cf-dur, 1.1s) cubic-bezier(0.22, 0.8, 0.36, 1) forwards;
    z-index: 899;
  }
  @keyframes pw-confettiFall {
    0% {
      transform: translate(0, 0) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
      opacity: 1;
    }
    60% {
      opacity: 0.85;
    }
    100% {
      transform: translate(var(--pw-cf-dx, 35px), var(--pw-cf-dy, 100px)) rotateX(540deg) rotateY(360deg) rotateZ(270deg);
      opacity: 0;
    }
  }

  /* 陪伴统计条 */
  .stats-bar {
    display: flex;
    gap: 8px;
    font-size: 11.5px;
    color: var(--ink);
    opacity: 0.85;
    margin: 12px auto 0;
    max-width: 540px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .stats-chip {
    background: #FBF8F0;
    border: 1px solid rgba(46,42,36,.12);
    border-radius: 999px;
    padding: 4px 10px;
  }

  /* 减少动态效果 */
  @media (prefers-reduced-motion: reduce) {
    .pet *, .pet, .pet-official *, .pet-official { animation: none !important; transition: none !important; }
    .pw-water-ripple, .pw-stream-bubble, .pw-splash-drop, .pw-drag-drip, .pw-confetti { display: none !important; }
  }
</style>

  // ===== 陪伴统计存储 =====
  const STATS_KEY = 'pet-whale:stats';
  function loadStats() {
    try {
      const raw = localStorage.getItem(STATS_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        return {
          completedRounds: p.completedRounds || 0,
          errorCount: p.errorCount || 0,
          interactionCount: p.interactionCount || 0,
          firstDate: p.firstDate || new Date().toISOString().slice(0, 10)
        };
      }
    } catch(e) {}
    const init = {
      completedRounds: 0,
      errorCount: 0,
      interactionCount: 0,
      firstDate: new Date().toISOString().slice(0, 10)
    };
    try { localStorage.setItem(STATS_KEY, JSON.stringify(init)); } catch(e) {}
    return init;
  }

  function saveStats(s) {
    try { localStorage.setItem(STATS_KEY, JSON.stringify(s)); } catch(e) {}
    updateStatsUI();
  }

  function recordCelebrate() {
    const s = loadStats();
    s.completedRounds++;
    saveStats(s);
  }

  function recordError() {
    const s = loadStats();

    saveStats(s);
  }

  function recordInteraction() {

      <span class="stats-chip">${dict.interactions(s.interactionCount)}</span>
      <span class="stats-chip">${dict.errors(s.errorCount)}</span>
      <span class="stats-chip">${dict.days(days)}</span>

  // ===== 纯原生 WebAudio 音效 =====
  function getAudioCtx() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playSound(type) {
    if (!isSoundOn) return;
    try {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;

      if (type === 'bubble') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(840, now + 0.12);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'work') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(720, now);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.07);
      } else if (type === 'celebrate') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0.2, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.23);
        });
      } else if (type === 'error') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.25);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.26);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.27);
      } else if (type === 'snack') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(580, now + 0.1);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      } else if (type === 'trick') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(350, now);
        osc.frequency.exponentialRampToValueAtTime(1050, now + 0.35);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.42);
      }
    } catch(e) {}
  }

      p2.style.transform = `translate(${dx2}px, ${dy2}px)`;
    }
  });

  // ===== 自主游泳动效系统 =====
  let isSwimOn = false;
  let swimRaf = 0;
  let swimTimer = null;
  let swimStartTime = 0;
  let swimDuration = 2400;
  let swimStartPos = { x: 0, y: 0 };
  let swimTargetPos = { x: 0, y: 0 };
  let swimCp1 = { x: 0, y: 0 };
  let swimCp2 = { x: 0, y: 0 };
  let swimFacing = 'left';
  let swimMode = 'cruise';
  let lastSwimBubble = 0;
  let hasSplashedThisSession = false;

  function stopSwim() {
    if (swimRaf) {
      cancelAnimationFrame(swimRaf);
      swimRaf = 0;
    }
    clearTimeout(swimTimer);
    swimTimer = null;
    clearPreviewParticles();
    [pet, pet2].forEach(p => {
      p.classList.remove('swimming', 'swimming-dive');
      p.style.opacity = '1';
      p.style.transform = `scaleX(${swimFacing === 'left' ? 1 : -1}) rotate(0deg)`;
    });
  }

  function schedulePreviewSwim(delay = 2500) {
    clearTimeout(swimTimer);
    if (!isSwimOn || currentState !== 'idle' || isSleeping) return;
    swimTimer = setTimeout(() => {
      if (!isSwimOn || currentState !== 'idle' || isSleeping) return;
      startPreviewSwimSession();
    }, delay);
  }

  function startPreviewSwimSession() {
    stopSwim();
    const activePet = pet.style.display !== 'none' ? pet : pet2;
    swimMode = Math.random() < 0.25 ? 'dive' : 'cruise';
    
    const bounds = document.body.classList.contains('desktop-mode') 
      ? { minX: -220, maxX: 220, minY: -140, maxY: 140 }
      : { minX: -50, maxX: 50, minY: -30, maxY: 30 };

    const curX = parseFloat(activePet.dataset.swimX || '0');
    const curY = parseFloat(activePet.dataset.swimY || '0');
    swimStartPos = { x: curX, y: curY };

    const targetX = Math.max(bounds.minX, Math.min(bounds.maxX, (Math.random() * (bounds.maxX - bounds.minX) + bounds.minX)));
    const targetY = Math.max(bounds.minY, Math.min(bounds.maxY, (Math.random() * (bounds.maxY - bounds.minY) + bounds.minY)));
    swimTargetPos = { x: targetX, y: targetY };

    const dx = targetX - curX;
    const dy = targetY - curY;
    const dist = Math.hypot(dx, dy) || 1;
    const nx = -dy / dist;
    const ny = dx / dist;
    const curve = (swimMode === 'dive' ? 25 : (15 + Math.random() * 15)) * (Math.random() < 0.5 ? 1 : -1);

    if (swimMode === 'dive') {
      swimCp1 = { x: curX + dx * 0.3 + nx * curve * 0.5, y: curY + dy * 0.2 + 20 };
      swimCp2 = { x: curX + dx * 0.7 + nx * curve * 0.5, y: curY + dy * 0.8 + 15 };
    } else {
      swimCp1 = { x: curX + dx * 0.33 + nx * curve, y: curY + dy * 0.33 + ny * curve };
      swimCp2 = { x: curX + dx * 0.67 + nx * curve * 0.6, y: curY + dy * 0.67 + ny * curve * 0.6 };
    }

    swimDuration = Math.max(1600, Math.min(3200, dist * 18 + (swimMode === 'dive' ? 500 : 0)));
    swimStartTime = performance.now();
    lastSwimBubble = swimStartTime;
    hasSplashedThisSession = false;

    [pet, pet2].forEach(p => {
      p.classList.add('swimming');
      if (swimMode === 'dive') p.classList.add('swimming-dive');
    });

    if (Math.random() < 0.3) {
      showDialog(pick(i18n[currentLang].swimQuotes));
    }

    swimRaf = requestAnimationFrame(stepPreviewSwim);
  }

  function stepPreviewSwim(now) {
    if (!isSwimOn || currentState !== 'idle' || isSleeping) {
      stopSwim();
      return;
    }
    const elapsed = now - swimStartTime;
    const progress = Math.min(1, elapsed / swimDuration);
    const ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;

    const u = ease;
    const u1 = 1 - u;
    const curX = u1 * u1 * u1 * swimStartPos.x + 3 * u1 * u1 * u * swimCp1.x + 3 * u1 * u * u * swimCp2.x + u * u * u * swimTargetPos.x;
    const curY = u1 * u1 * u1 * swimStartPos.y + 3 * u1 * u1 * u * swimCp1.y + 3 * u1 * u * u * swimCp2.y + u * u * u * swimTargetPos.y;

    const dX = 3 * u1 * u1 * (swimCp1.x - swimStartPos.x) + 6 * u1 * u * (swimCp2.x - swimCp1.x) + 3 * u * u * (swimTargetPos.x - swimCp2.x);
    const dY = 3 * u1 * u1 * (swimCp1.y - swimStartPos.y) + 6 * u1 * u * (swimCp2.y - swimCp1.y) + 3 * u * u * (swimTargetPos.y - swimCp2.y);

    if (Math.abs(dX) > 0.4) {
      swimFacing = dX > 0 ? 'right' : 'left';
    }

    const speed = Math.hypot(dX, dY) || 1;
    const maxPitch = swimMode === 'dive' ? 22 : 12;
    let pitch = (dY / speed) * maxPitch;
    if (swimFacing === 'left') pitch = -pitch;
    pitch += Math.sin(progress * Math.PI * 6) * 1.8;

    let depthScale = 1;
    let depthOpacity = 1;
    if (swimMode === 'dive') {
      const arc = Math.sin(progress * Math.PI);
      depthScale = 1 - arc * 0.12;
      depthOpacity = 1 - arc * 0.2;
    }

    const sx = (swimFacing === 'left' ? 1 : -1) * depthScale;
    const sy = depthScale;

    [pet, pet2].forEach(p => {
      p.dataset.swimX = curX.toFixed(2);
      p.dataset.swimY = curY.toFixed(2);
      p.style.transform = `translate(${curX.toFixed(2)}px, ${curY.toFixed(2)}px) scale(${sx}, ${sy}) rotate(${pitch.toFixed(2)}deg)`;
      p.style.opacity = depthOpacity.toFixed(3);
    });

    const activePet = pet.style.display !== 'none' ? pet : pet2;
    const rect = activePet.getBoundingClientRect();
    const tailX = swimFacing === 'left' ? rect.right - 28 : rect.left + 28;
    const tailY = rect.top + rect.height * 0.55;
    const isDive = swimMode === 'dive';

    if (now - lastPreviewRipple > (isDive ? 220 : 300) && progress > 0.08 && progress < 0.92) {
      lastPreviewRipple = now;
      spawnPreviewRipple(tailX, tailY, isDive);
    }

    if (now - lastPreviewStreamBubble > (isDive ? 140 : 200) && progress > 0.05 && progress < 0.95) {
      lastPreviewStreamBubble = now;
      spawnPreviewStreamBubble(tailX, tailY, swimFacing, isDive);
    }

    if (isDive && progress > 0.72 && progress < 0.85 && !hasSplashedThisSession) {
      hasSplashedThisSession = true;
      spawnPreviewSplash(rect.left + rect.width / 2, rect.top + rect.height * 0.65, 5);
      spawnPreviewRipple(rect.left + rect.width / 2, rect.top + rect.height * 0.65, true);
    }

    if (now - lastSwimBubble > (isDive ? 280 : 500)) {
      lastSwimBubble = now;
      popBubble(activePet);
    }

    if (progress < 1) {
      swimRaf = requestAnimationFrame(stepPreviewSwim);
    } else {
      swimRaf = 0;
      [pet, pet2].forEach(p => {
        p.classList.remove('swimming', 'swimming-dive');
        p.style.opacity = '1';
        p.style.transform = `translate(${swimTargetPos.x.toFixed(2)}px, ${swimTargetPos.y.toFixed(2)}px) scaleX(${swimFacing === 'left' ? 1 : -1}) rotate(0deg)`;
      });
      schedulePreviewSwim(2000 + Math.random() * 2500);
    }
  }

  // ===== 全屏粒子生成器（使用独立固定容器，彻底解决跟随位移问题） =====
  let previewParticles = [];
  let lastPreviewRipple = 0;
  let lastPreviewStreamBubble = 0;

  function spawnPreviewRipple(x, y, isDive) {
    const el = document.createElement('span');
    el.className = 'pw-water-ripple';
    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
    el.style.width = isDive ? '50px' : '36px';
    el.style.height = isDive ? '30px' : '22px';
    particleLayer.appendChild(el);
    previewParticles.push(el);
    el.addEventListener('animationend', () => {
      const idx = previewParticles.indexOf(el);
      if (idx !== -1) previewParticles.splice(idx, 1);
      el.remove();
    }, { once: true });
    if (previewParticles.length > 35) {
      const oldest = previewParticles.shift();
      oldest?.remove();
    }
  }

  function spawnPreviewStreamBubble(x, y, facing, isDive) {
    const el = document.createElement('span');
    el.className = 'pw-stream-bubble';
    const size = isDive ? (5 + Math.random() * 4.5) : (3.5 + Math.random() * 3.5);
    const dx = (facing === 'left' ? 1 : -1) * (8 + Math.random() * 14);
    const dy = -(12 + Math.random() * 20);
    const dur = 0.85 + Math.random() * 0.4;
    el.style.left = `${x + (Math.random() * 10 - 5)}px`;
    el.style.top = `${y + (Math.random() * 8 - 4)}px`;
    el.style.width = `${size.toFixed(1)}px`;
    el.style.height = `${size.toFixed(1)}px`;
    el.style.setProperty('--pw-b-dx', `${dx.toFixed(1)}px`);
    el.style.setProperty('--pw-b-dy', `${dy.toFixed(1)}px`);
    el.style.setProperty('--pw-b-dur', `${dur.toFixed(2)}s`);
    particleLayer.appendChild(el);
    previewParticles.push(el);
    el.addEventListener('animationend', () => {
      const idx = previewParticles.indexOf(el);
      if (idx !== -1) previewParticles.splice(idx, 1);
      el.remove();
    }, { once: true });
    if (previewParticles.length > 35) {
      const oldest = previewParticles.shift();
      oldest?.remove();
    }
  }

  function spawnPreviewSplash(x, y, count = 5) {
    for (let i = 0; i < count; i++) {
      const drop = document.createElement('span');
      drop.className = 'pw-splash-drop';
      const size = 3 + Math.random() * 3.5;
      const dx = (Math.random() * 36 - 18);
      const dy = -(18 + Math.random() * 26);
      const dur = 0.5 + Math.random() * 0.25;

      drop.style.left = `${x + (Math.random() * 14 - 7)}px`;
      drop.style.top = `${y}px`;
      drop.style.width = `${size.toFixed(1)}px`;
      drop.style.height = `${size.toFixed(1)}px`;
      drop.style.setProperty('--pw-sp-dx', `${dx.toFixed(1)}px`);
      drop.style.setProperty('--pw-sp-dy', `${dy.toFixed(1)}px`);
      drop.style.setProperty('--pw-sp-dur', `${dur.toFixed(2)}s`);

      particleLayer.appendChild(drop);
      previewParticles.push(drop);
      drop.addEventListener('animationend', () => {
        const idx = previewParticles.indexOf(drop);
        if (idx !== -1) previewParticles.splice(idx, 1);
        drop.remove();
      }, { once: true });
    }
    if (previewParticles.length > 35) {
      const oldest = previewParticles.shift();
      oldest?.remove();
    }
  }

  function spawnPreviewDrip(x, y) {
    const drip = document.createElement('span');
    drip.className = 'pw-drag-drip';
    drip.style.left = `${x + (Math.random() * 10 - 5)}px`;
    drip.style.top = `${y}px`;
    drip.style.width = '4px';
    drip.style.height = '6.5px';
    particleLayer.appendChild(drip);
    previewParticles.push(drip);
    drip.addEventListener('animationend', () => {
      const idx = previewParticles.indexOf(drip);
      if (idx !== -1) previewParticles.splice(idx, 1);
      drip.remove();
    }, { once: true });
  }

  function spawnPreviewConfetti(x, y, count = 18) {
    const colors = ['#4D6BFE', '#8FB5FF', '#3BC46D', '#FFD15C', '#F0A0A0', '#B388FF', '#FF9F43'];
    for (let i = 0; i < count; i++) {
      const el = document.createElement('span');
      el.className = 'pw-confetti';
      const w = 4.5 + Math.random() * 4;
      const h = 6 + Math.random() * 5;
      const color = pick(colors);
      const dx = Math.random() * 100 - 50;
      const dy = -(40 + Math.random() * 50);
      const dur = 0.95 + Math.random() * 0.35;

      el.style.left = `${x + (Math.random() * 16 - 8)}px`;
      el.style.top = `${y + (Math.random() * 8 - 4)}px`;
      el.style.setProperty('--pw-cf-w', `${w.toFixed(1)}px`);
      el.style.setProperty('--pw-cf-h', `${h.toFixed(1)}px`);
      el.style.setProperty('--pw-cf-bg', color);
      el.style.setProperty('--pw-cf-dx', `${dx.toFixed(1)}px`);
      el.style.setProperty('--pw-cf-dy', `${(Math.abs(dy) + 90 + Math.random() * 40).toFixed(1)}px`);
      el.style.setProperty('--pw-cf-dur', `${dur.toFixed(2)}s`);

      particleLayer.appendChild(el);
      previewParticles.push(el);
      el.addEventListener('animationend', () => {
        const idx = previewParticles.indexOf(el);
        if (idx !== -1) previewParticles.splice(idx, 1);
        el.remove();
      }, { once: true });
    }
  }

  function clearPreviewParticles() {
    previewParticles.forEach(p => p.remove());
    previewParticles = [];
  }

  swimBtn.addEventListener('click', () => {
    isSwimOn = !isSwimOn;
    swimBtn.classList.toggle('active', isSwimOn);
    swimBtn.textContent = isSwimOn ? i18n[currentLang].swimOn : i18n[currentLang].swimOff;
    if (isSwimOn) {
      schedulePreviewSwim(800);
      showDialog(i18n[currentLang].swimOnMsg);
      playSound('bubble');
    } else {
      stopSwim();
      [pet, pet2].forEach(p => {
        p.dataset.swimX = '0';
        p.dataset.swimY = '0';
        p.style.transform = '';
      });
      showDialog(i18n[currentLang].swimOffMsg);
    }
  });

  // 初始化
  try {
    const savedLang = localStorage.getItem('pet-whale:lang');
    if (savedLang === 'en' || savedLang === 'zh') currentLang = savedLang;
  } catch(e) {}
  applyLanguage(currentLang);
  resetInactivityTimer();
</script>
</body>
</html>

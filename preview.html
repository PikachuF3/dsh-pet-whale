<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桌宠小鲸鱼 · 最终定版预览</title>
<style>
  :root {
    --clay: #4D6BFE;        /* 陶土身体 */
    --paper: #F7F2E6;       /* 米白肚皮/背景 */
    --ink: #2E2A24;         /* 暖墨眼睛 */
    --blush: #F0A0A0;       /* 腮红 */
    --bubble: #E8D9BC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--paper);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 20px;
    user-select: none;
    transition: background 0.3s ease;
  }

  /* 桌面壁纸预览模式 */
  body.desktop-mode {
    background: radial-gradient(circle at 50% 30%, #EAE2D2 0%, #D8CEBB 100%);
  }
  body.desktop-mode .header-bar,
  body.desktop-mode .controls,
  body.desktop-mode .interact-bar,
  body.desktop-mode .mode-switch,
  body.desktop-mode .hint {
    opacity: 0.25;
    transition: opacity 0.2s ease;
  }
  body.desktop-mode:hover .header-bar,
  body.desktop-mode:hover .controls,
  body.desktop-mode:hover .interact-bar,
  body.desktop-mode:hover .mode-switch,
  body.desktop-mode:hover .hint {
    opacity: 1;
  }
  
  /* 顶部导航与操作栏 */
  .header-bar {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 440px;
  }
  h1 { font-size: 19px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 6px; }
  .sub { font-size: 12px; opacity: .7; margin: 2px 0 0; }
  
  .top-tools { display: flex; gap: 6px; }
  .tool-btn {
    border: 1px solid rgba(46,42,36,.18);
    background: #FBF8F0;
    color: var(--ink);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12px;
    cursor: pointer;
    display: flex; align-items: center; gap: 4px;
    transition: all .15s ease;
  }
  .tool-btn:hover { background: #F1EBDD; }
  .tool-btn.active { background: var(--clay); color: #FBF8F0; border-color: var(--clay); }

  /* ===== 舞台 ===== */
  .stage-wrap {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
  }
  
  /* 状态互动气泡 */
  .dialog-bubble {
    position: absolute; top: -38px; left: 50%;
    transform: translateX(-50%);
    background: #FFFFFF;
    color: var(--ink);
    border: 1px solid rgba(46,42,36,.15);
    border-radius: 12px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(46,42,36,.08);
    pointer-events: none;
    transition: all .25s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 20;
  }
  .dialog-bubble::after {
    content: ""; position: absolute; bottom: -5px; left: 50%; margin-left: -5px;
    border-width: 5px 5px 0; border-style: solid;
    border-color: #FFFFFF transparent transparent;
  }

  .stage {
    width: 270px; height: 210px;
    border: 1px solid rgba(46,42,36,.12);
    border-radius: 18px;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(46,42,36,.06), transparent 60%),
      #FBF8F0;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    box-shadow: 0 8px 24px rgba(46,42,36,.04);
    transition: all 0.3s ease;
  }

  /* 桌面挂件透明拖拽模式 */
  body.desktop-mode .stage {
    background: transparent;
    border: 1px dashed rgba(163, 80, 44, 0.4);
    box-shadow: none;
    cursor: grab;
  }
  body.desktop-mode .stage:active {
    cursor: grabbing;
  }

  /* 动态波光水面线 */
  .stage::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 32px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(46,42,36,.1), rgba(46,42,36,.15), rgba(46,42,36,.1), transparent);
    animation: waterShimmer 3.5s ease-in-out infinite alternate;
  }
  @keyframes waterShimmer {
    0%   { opacity: 0.4; transform: scaleX(0.92); }
    100% { opacity: 0.9; transform: scaleX(1.04); }
  }

  /* ===== 鲸鱼容器 ===== */
  .pet {
    width: 150px; height: 110px;
    position: relative;
    cursor: pointer;
  }
  .pet svg {
    width: 100%; height: 100%; display: block; overflow: visible;
    transform-origin: 50% 85%;
  }

  /* 泡泡 */
  .bubble {
    position: absolute; left: 50%; bottom: 8px;
    width: 10px; height: 10px; margin-left: -5px;
    border-radius: 50%;
    background: rgba(232,217,188,.9);
    border: 1px solid rgba(46,42,36,.15);
    opacity: 0; pointer-events: none;
  }
  .bubble::after {
    content: ""; position: absolute; left: 2px; top: 2px;
    width: 3px; height: 3px; border-radius: 50%;
    background: rgba(255,255,255,.85);
  }
  .bubble.show { animation: rise 0.9s ease-out forwards; }

  /* 投喂小鱼干 */
  .snack-fish {
    position: absolute; top: -10px; left: 20px;
    font-size: 18px; opacity: 0; pointer-events: none;
    z-index: 15;
  }
  .snack-fish.drop { animation: dropSnack 0.7s ease-in forwards; }

  @keyframes dropSnack {
    0%   { transform: translateY(0) rotate(0); opacity: 1; }
    80%  { transform: translateY(110px) rotate(45deg); opacity: 1; }
    100% { transform: translateY(125px) scale(0.5); opacity: 0; }
  }

  /* 打瞌睡 Zzz 气泡 */
  .sleep-zzz {
    position: absolute; left: 58%; top: 26px;
    font-size: 13px; font-weight: bold; color: #3550C9;
    opacity: 0; pointer-events: none;
  }
  .sleep-mode .sleep-zzz { animation: zzzFloat 2.8s ease-in-out infinite; }
  @keyframes zzzFloat {
    0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
    30%  { opacity: 0.9; }
    100% { transform: translate(14px, -24px) scale(1.15); opacity: 0; }
  }

  /* ===== 状态动画 ===== */
  .pet.idle .tail       { animation: tailWave 1.6s ease-in-out infinite; transform-box: view-box; }
  .pet.idle .body       { animation: bob 3.2s ease-in-out infinite; }
  .pet .eye-group       { animation: blink 4.5s ease-in-out infinite; transform-origin: 52px 40px; }

  .pet.think { animation: dive 3.2s ease-in-out infinite; }

  .pet.working { animation: swim 1.1s ease-in-out infinite; }
  .pet.working .tail { animation: tailFast 0.35s ease-in-out infinite; transform-box: view-box; }
  .pet.working .body { animation: none; }
  .pet.working .keyboard-unit { display: block !important; }
  .pet.working .code-particle { display: block !important; }

  .pet.celebrate { animation: leap 1.4s ease-in-out infinite; }
  .pet.celebrate .bubble { animation: rise 1.2s ease-out 0.3s infinite; }
  .pet.celebrate .bubble.b2 { animation-delay: 0.7s; }
  .pet.celebrate .bubble.b3 { animation-delay: 1.05s; }

  .pet.error { animation: shake 0.5s ease-in-out infinite; }

  /* 双击翻滚花样动作 (360° Barrel Roll) */
  @keyframes rollTrick {
    0%   { transform: translateY(0) rotate(0deg) scale(1, 1); }
    30%  { transform: translateY(-30px) rotate(-120deg) scale(1.08, 0.92); }
    70%  { transform: translateY(-20px) rotate(-260deg) scale(0.95, 1.05); }
    100% { transform: translateY(0) rotate(-360deg) scale(1, 1); }
  }
  .pet.rolling, .pet-official.rolling {
    animation: rollTrick 0.65s cubic-bezier(0.34, 1.4, 0.64, 1) !important;
  }

  /* 休眠打瞌睡动效：整组眼睛闭合为一条线，高光彻底隐藏，绝不残留白点 */
  @keyframes sleepBob {
    0%,100% { transform: translateY(0) scale(1, 1); }
    50%     { transform: translateY(3px) scale(1.02, 0.97); }
  }
  .sleep-mode .body { animation: sleepBob 4s ease-in-out infinite !important; }
  .sleep-mode .eye-group { transform: scaleY(0.08) !important; }
  .sleep-mode .pupil-highlight { opacity: 0 !important; }

  /* keyframes */
  @keyframes tailWave {
    0%,100% { transform: rotate(9deg); }
    50%     { transform: rotate(-15deg); }
  }
  @keyframes tailFast {
    0%,100% { transform: rotate(12deg); }
    50%     { transform: rotate(-22deg); }
  }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-6px); }
  }
  /* 眨眼：整个 eye-group（包括眼黑与高光）一起缩放闭合，眨眼时眼白彻底消失 */
  @keyframes blink {
    0%, 91%, 100% { transform: scaleY(1); }
    94%           { transform: scaleY(0.08); }
    97%           { transform: scaleY(1); }
  }
  @keyframes dive {
    0%, 12%   { transform: translateY(0); opacity: 1; }
    38%, 72%  { transform: translateY(46px); opacity: .45; }
    92%, 100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes leap {
    0%, 100%  { transform: translateY(0) rotate(0deg); }
    18%       { transform: translateY(-34px) rotate(-8deg); }
    42%       { transform: translateY(0) rotate(4deg); }
    60%       { transform: translateY(-14px) rotate(-3deg); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-5px); }
    50%      { transform: translateX(4px); }
    75%      { transform: translateX(-3px); }
  }
  @keyframes rise {
    0%   { transform: translateY(0) scale(.6); opacity: 0; }
    20%  { opacity: .9; }
    100% { transform: translateY(-70px) scale(1.1); opacity: 0; }
  }

  /* Q 弹：浮动 + 挤压拉伸 */
  @keyframes qbob {
    0%,100% { transform: translateY(0) scale(1, 1); }
    22%     { transform: translateY(-7px) scale(.985, 1.035); }
    50%     { transform: translateY(2px) scale(1.02, .965); }
    72%     { transform: translateY(-3px) scale(.995, 1.012); }
  }
  /* 深潜：下沉压扁 + 划水微摆，上浮拉伸 */
  @keyframes dive2 {
    0%, 10%  { transform: translateY(0) rotate(0) scale(1, 1); opacity: 1; }
    24%      { transform: translateY(12px) rotate(-7deg) scale(1.03, .95); opacity: .78; }
    38%, 70% { transform: translateY(46px) rotate(3deg) scale(.95, 1.05); opacity: .42; }
    84%      { transform: translateY(9px) rotate(-5deg) scale(1.03, .96); opacity: .85; }
    94%,100% { transform: translateY(0) rotate(0) scale(1, 1); opacity: 1; }
  }
  /* 完成：跃起拉伸 → 落地 squash 回弹 */
  @keyframes leap2 {
    0%, 100%  { transform: translateY(0) rotate(0) scale(1, 1); }
    14%       { transform: translateY(-38px) rotate(-10deg) scale(.97, 1.06); }
    36%       { transform: translateY(2px) rotate(5deg) scale(1.09, .88); }
    52%       { transform: translateY(-17px) rotate(-4deg) scale(.98, 1.04); }
    72%       { transform: translateY(-4px) rotate(2deg) scale(1.03, .94); }
  }
  /* 点击挤压回弹：作用在内部 SVG 上，完全不干扰外部位置位移，绝无打断回位 */
  @keyframes squish {
    0%   { transform: scale(1, 1); }
    25%  { transform: scale(1.15, 0.82); }
    55%  { transform: scale(0.93, 1.09); }
    78%  { transform: scale(1.03, 0.98); }
    100% { transform: scale(1, 1); }
  }
  .pet.squish svg,
  .pet-official.squish svg {
    animation: squish 0.42s cubic-bezier(0.25, 1.4, 0.5, 1);
  }

  /* 阴影随浮动收缩 */
  @keyframes shadowBob {
    0%,100% { transform: scale(1); opacity: .9; }
    50%     { transform: scale(.78); opacity: .5; }
  }
  /* 工作：往前游动（水平往返 + 身体轻摆） */
  @keyframes swim {
    0%,100% { transform: translateX(-5px) translateY(0) rotate(-1.5deg); }
    50%     { transform: translateX(5px) translateY(-2.5px) rotate(1.5deg); }
  }
  /* 键盘敲击微动 */
  @keyframes keyTap1 {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(0.4px); }
  }
  @keyframes keyTap2 {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(0.4px); }
  }
  .tap-k1 { animation: keyTap1 0.16s ease-in-out infinite alternate; }
  .tap-k2 { animation: keyTap2 0.18s ease-in-out 0.08s infinite alternate; }

  /* 代码字符飘出动画 */
  @keyframes codeFloat1 {
    0%   { transform: translateY(0) scale(0.5); opacity: 0; }
    30%  { opacity: 0.95; }
    100% { transform: translateY(-16px) translateX(-5px) scale(1); opacity: 0; }
  }
  @keyframes codeFloat2 {
    0%   { transform: translateY(0) scale(0.5); opacity: 0; }
    30%  { opacity: 0.95; }
    100% { transform: translateY(-17px) translateX(4px) scale(1.05); opacity: 0; }
  }
  .code-fx1 { animation: codeFloat1 1.2s ease-out infinite; }
  .code-fx2 { animation: codeFloat2 1.2s ease-out 0.6s infinite; }

  /* 深潜气泡上浮（带横向漂移） */
  @keyframes riseBlue {
    0%   { transform: translate(8px, 30px) scale(.5); opacity: 0; }
    25%  { opacity: .85; }
    100% { transform: translate(-10px, -46px) scale(1.15); opacity: 0; }
  }
  /* 尴尬黑线抖动 */
  @keyframes angryJitter {
    0%,100% { transform: translateX(0); }
    50%     { transform: translateX(-1.2px); }
  }
  /* 星星旋转闪烁 */
  @keyframes starSpin {
    0%,100% { transform: scale(1) rotate(0deg); opacity: 1; }
    50%     { transform: scale(1.3) rotate(22deg); opacity: .65; }
  }

  /* 悬停互动：腮红加深，更开心 */
  .pet:hover .eye-group, .pet-official:hover .eye-group {
    filter: drop-shadow(0 0 1px rgba(217, 142, 106, 0.8));
  }

  /* ===== 控制区 ===== */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 420px; }
  .controls button {
    border: 1px solid rgba(46,42,36,.18);
    background: #FBF8F0;
    color: var(--ink);
    border-radius: 999px;
    padding: 7px 15px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .controls button:hover { background: #F1EBDD; transform: translateY(-1px); }
  .controls button.active { background: var(--clay); color: #FBF8F0; border-color: var(--clay); }

  /* 互动操作按钮 */
  .interact-bar {
    display: flex; gap: 8px; justify-content: center; margin-top: -6px;
  }
  .interact-btn {
    border: 1px dashed rgba(46,42,36,.25);
    background: #FFFDF9;
    color: var(--clay);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; gap: 4px;
    transition: all .15s;
  }
  .interact-btn:hover { background: #F7EFE4; border-color: var(--clay); }

  .hint { font-size: 12px; opacity: .6; text-align: center; max-width: 420px; margin: 0; line-height: 1.5; }

  /* ===== V2：官方轮廓版（完整复用 FishLogo 官方纯正路径）===== */
  .pet-official {
    width: 190px; height: 140px;
    position: relative;
    cursor: pointer;
  }
  .pet-official svg {
    width: 100%; height: 100%; display: block; overflow: visible;
    transform-origin: 50% 85%;
  }
  .pet-official .body { animation: qbob 3.2s ease-in-out infinite; }
  .pet-official .eye-group { animation: blink 4.5s ease-in-out infinite; transform-origin: 5.55px 5.7px; }
  .pet-official.think { animation: dive2 3.2s ease-in-out infinite; }
  /* 深潜时浅蓝气泡 */
  .pet-official .bubble-blue {
    position: absolute; left: 50%; bottom: 6px;
    width: 9px; height: 9px; margin-left: -4.5px;
    border-radius: 50%;
    background: rgba(168, 200, 232, .78);
    border: 1px solid rgba(96, 138, 190, .4);
    opacity: 0; pointer-events: none;
  }
  .pet-official .bubble-blue::after {
    content: ""; position: absolute; left: 2px; top: 2px;
    width: 2.5px; height: 2.5px; border-radius: 50%;
    background: rgba(255,255,255,.85);
  }
  .pet-official.think .bubble-blue { animation: riseBlue 3.2s ease-out infinite; }
  .pet-official.think .bubble-blue.bb2 { animation-delay: 0.9s; }
  .pet-official.think .bubble-blue.bb3 { animation-delay: 1.8s; }
  /* 工作：往前游 + 键盘敲击 */
  .pet-official.working { animation: swim 1.1s ease-in-out infinite; }
  .pet-official.working .body { animation: none; }
  .pet-official.working .keyboard-unit { display: block !important; }
  .pet-official.working .code-particle { display: block !important; }
  /* 报错：头顶尴尬黑线 */
  .pet-official.error .angry { display: block; animation: angryJitter 0.5s ease-in-out infinite; }
  /* 完成：星星闪光 */
  .pet-official.celebrate .stars { display: block; }
  .pet-official.celebrate .starL { animation: starSpin 1.2s ease-in-out infinite; }
  .pet-official.celebrate .starR { animation: starSpin 1.2s ease-in-out 0.3s infinite; }
  .pet-official.celebrate { animation: leap2 1.4s ease-in-out infinite; }
  .pet-official.celebrate .bubble { animation: rise 1.2s ease-out 0.3s infinite; }
  .pet-official.celebrate .bubble.b2 { animation-delay: 0.7s; }
  .pet-official.celebrate .bubble.b3 { animation-delay: 1.05s; }
  .pet-official.error { animation: shake 0.5s ease-in-out infinite; }
  /* 地面阴影：与浮动联动，浮起时收缩变淡 → 立体/离地感 */
  .pet-official::after {
    content: ""; position: absolute; left: 50%; bottom: -16px;
    width: 110px; height: 16px; margin-left: -55px;
    background: radial-gradient(ellipse, rgba(46,42,36,.24), transparent 65%);
    border-radius: 50%;
    animation: shadowBob 3.2s ease-in-out infinite;
    pointer-events: none;
  }

  .mode-switch { display: flex; gap: 8px; margin-bottom: 2px; }
  .mode-switch button {
    border: 1px solid rgba(46,42,36,.18); background: #FBF8F0; color: var(--ink);
    border-radius: 999px; padding: 6px 14px; font-size: 12px; cursor: pointer;
  }
  .mode-switch button.active { background: var(--clay); color: #FBF8F0; border-color: var(--clay); }

  /* 减少动态效果 */
  @media (prefers-reduced-motion: reduce) {
    .pet *, .pet, .pet-official *, .pet-official { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="header-bar">
    <div>
      <h1>🐳 桌宠小鲸鱼 · 预览</h1>
      <p class="sub">DeepSeek 官方主题桌面宠物 · 伴随 Agent 状态响应</p>
    </div>
    <div class="top-tools">
      <button class="tool-btn" id="dockBtn" title="切换桌面悬浮模式">🖥️ 悬浮模式</button>
      <button class="tool-btn active" id="soundBtn" title="切换音效">🔊 音效: 开</button>
    </div>
  </div>

  <div class="stage-wrap">
    <!-- 状态语音气泡 -->
    <div class="dialog-bubble" id="dialogBubble">小鲸鱼待命中~ 点击我可以戳戳哦 🐳</div>

    <div class="stage" id="stage">
      <span class="snack-fish" id="snackFish">🐟</span>
      <span class="sleep-zzz" id="sleepZzz">Zzz...</span>

      <!-- V1：Q 版圆润 -->
      <div class="pet idle" id="pet" style="display:none">
        <svg viewBox="0 0 150 110" aria-hidden="true">
          <!-- 尾鳍 -->
          <g class="tail" style="transform-origin: 108px 52px">
            <path d="M108 50 Q 128 38 136 30 Q 130 52 136 74 Q 126 60 108 56 Z" fill="#4D6BFE"/>
          </g>

          <!-- 身体 -->
          <g class="body">
            <path d="M30 50 C 30 26, 62 18, 88 26 C 106 31, 116 40, 114 52 C 112 66, 92 74, 62 74 C 40 74, 30 64, 30 50 Z" fill="#4D6BFE"/>
            <!-- 肚皮 -->
            <path d="M34 54 C 36 66, 54 72, 76 70 C 94 68, 106 62, 108 54 C 100 64, 72 68, 50 66 C 40 65, 35 60, 34 54 Z" fill="#F7F2E6"/>
            <!-- 小鳍 -->
            <path d="M64 66 Q 62 78 72 82 Q 74 72 70 66 Z" fill="#3550C9"/>

            <!-- 眼睛：整组眨眼与闭眼 -->
            <g class="eye-group">
              <circle class="eye" cx="52" cy="40" r="8.5" fill="#2E2A24"/>
              <circle class="pupil-highlight" cx="55" cy="37" r="3" fill="#FBF8F0"/>
            </g>
            <!-- 腮红 -->
            <circle cx="66" cy="48" r="4.5" fill="#F0A0A0" opacity=".55"/>
            <!-- 嘴 -->
            <path d="M44 52 Q 50 57 58 54" stroke="#3550C9" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          </g>

          <!-- V1 代码粒子 -->
          <g class="code-particle" style="display:none">
            <text x="18" y="68" font-size="10" fill="#4D6BFE" font-weight="bold" font-family="monospace" class="code-fx1">&lt;/&gt;</text>

    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playSound(type) {
    if (!isSoundOn) return;
    try {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;

      if (type === 'bubble') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(840, now + 0.12);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'work') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(720, now);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.07);
      } else if (type === 'celebrate') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0.2, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.23);
        });
      } else if (type === 'error') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.25);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.26);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.27);
      } else if (type === 'snack') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(580, now + 0.1);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      } else if (type === 'trick') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(350, now);
        osc.frequency.exponentialRampToValueAtTime(1050, now + 0.35);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.42);
      }
    } catch(e) {}
  }

  soundBtn.addEventListener('click', () => {
    isSoundOn = !isSoundOn;
    soundBtn.classList.toggle('active', isSoundOn);
    soundBtn.textContent = isSoundOn ? '🔊 音效: 开' : '🔇 音效: 关';
    if (isSoundOn) playSound('bubble');
  });

  // 桌面模式悬浮切换
  dockBtn.addEventListener('click', () => {
    document.body.classList.toggle('desktop-mode');
    dockBtn.classList.toggle('active');
    playSound('bubble');
  });

  // ===== 休眠与唤醒系统 (20秒无操作自动打瞌睡) =====
  function resetInactivityTimer() {
    clearTimeout(idleTimer);
    if (isSleeping) {
      isSleeping = false;
      stage.classList.remove('sleep-mode');
      showDialog("醒啦！随时准备开工~ ✨");
      playSound('bubble');
    }
    if (currentState === 'idle') {
      idleTimer = setTimeout(() => {
        if (currentState === 'idle') {
          isSleeping = true;
          stage.classList.add('sleep-mode');
          showDialog("呼噜噜... 正在做深海美梦 (Zzz) 💤");
        }
      }, 20000);
    }
  }

  // 状态切换
  function setState(s) {
    currentState = s;
    isSleeping = false;
    stage.classList.remove('sleep-mode');
    resetInactivityTimer();

    pet.className = 'pet ' + s;
    pet2.className = 'pet-official ' + s;
    buttons.forEach(b => b.classList.toggle('active', b.dataset.s === s));
    
    // 更新台词
    const list = statusDialogs[s] || statusDialogs.idle;
    showDialog(list[Math.floor(Math.random() * list.length)]);

    // 触发对应音效
    if (s === 'working') playSound('work');
    else if (s === 'celebrate') playSound('celebrate');
    else if (s === 'error') playSound('error');
    else playSound('bubble');
  }
  buttons.forEach(b => b.addEventListener('click', () => setState(b.dataset.s)));

  function setMode(m) {
    pet.style.display = m === 'v1' ? '' : 'none';
    pet2.style.display = m === 'v2' ? '' : 'none';
    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.m === m));
    playSound('bubble');
    resetInactivityTimer();
  }
  modeBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.m)));

  function popBubble(el) {
    const bubbles = el.querySelectorAll('.bubble');
    const b = bubbles[Math.floor(Math.random() * bubbles.length)];
    b.classList.remove('show');
    void b.offsetWidth;
    b.classList.add('show');
    setTimeout(() => b.classList.remove('show'), 950);
  }

  // 点击冒泡 + 果冻挤压 + 音效 + 随机戳戳台词
  function triggerSquish(el) {
    resetInactivityTimer();
    popBubble(el);
    playSound('bubble');
    el.classList.remove('squish');
    void el.offsetWidth;
    el.classList.add('squish');
    setTimeout(() => el.classList.remove('squish'), 450);

    const quote = pokeDialogs[Math.floor(Math.random() * pokeDialogs.length)];
    showDialog(quote);
  }

  // 双击翻跟头特技
  function triggerRoll(el) {
    resetInactivityTimer();
    playSound('trick');
    showDialog("翻个 360° 跟头给你看！(≧∇≦)ﾉ ✨");
    el.classList.remove('rolling');
    void el.offsetWidth;
    el.classList.add('rolling');
    popBubble(el);
    setTimeout(() => popBubble(el), 200);
    setTimeout(() => el.classList.remove('rolling'), 700);
  }

  pet.addEventListener('click', () => triggerSquish(pet));
  pet2.addEventListener('click', () => triggerSquish(pet2));
  pet.addEventListener('dblclick', () => triggerRoll(pet));
  pet2.addEventListener('dblclick', () => triggerRoll(pet2));

  // ===== 互动功能：投喂小鱼干 =====
  feedBtn.addEventListener('click', () => {
    resetInactivityTimer();
    snackFish.classList.remove('drop');
    void snackFish.offsetWidth;
    snackFish.classList.add('drop');
    playSound('snack');
    showDialog("嚼嚼嚼... 获得小鱼干能量！美味~ 🐟");
    setTimeout(() => {
      triggerSquish(pet.style.display !== 'none' ? pet : pet2);
      playSound('celebrate');
    }, 600);
  });

  // ===== 互动功能：翻跟头特技 =====
  trickBtn.addEventListener('click', () => {
    triggerRoll(pet.style.display !== 'none' ? pet : pet2);
  });

  // ===== 互动功能：摸摸头 =====
  petBtn.addEventListener('click', () => {
    triggerSquish(pet.style.display !== 'none' ? pet : pet2);
    showDialog("被摸摸头啦~ 暖洋洋的超开心 🥰");
  });

  // ===== 眼神追光互动（全局追踪：适度微动，绝不溢出眼眶） =====
  window.addEventListener('mousemove', (e) => {
    if (isSleeping) {
      resetInactivityTimer();
      return;
    }
    const rect = stage.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    // V1 (viewBox 150px): 微移限制在 ±1.1px 以内
    const p1 = pet.querySelector('.pupil-highlight');
    if (p1) {
      const dx1 = Math.max(-1.1, Math.min(1.1, (e.clientX - cx) / 100));
      const dy1 = Math.max(-0.9, Math.min(0.9, (e.clientY - cy) / 90));
      p1.style.transform = `translate(${dx1}px, ${dy1}px)`;
    }

    // V2 (viewBox 28px): 微移严格限制在 ±0.18px 以内，柔和微动
    const p2 = pet2.querySelector('.pupil-highlight');
    if (p2) {
      const dx2 = Math.max(-0.18, Math.min(0.18, (e.clientX - cx) / 500));
      const dy2 = Math.max(-0.15, Math.min(0.15, (e.clientY - cy) / 450));
      p2.style.transform = `translate(${dx2}px, ${dy2}px)`;
    }
  });

  // 初始化休眠计时
  resetInactivityTimer();
</script>
</body>
</html>
